[project]
name = 'github_classroom_toolkit'
readme = 'README.md'
classifiers = [
    'Development Status :: 1 - Planning',
    'License :: OSI Approved :: GNU Affero General Public License v3',
    'Topic :: Software Development :: Build Tools',
    'Programming Language :: Python :: 3',
    'Programming Language :: Java',
    'Programming Language :: Kotlin',
]
requires-python = '>=3.8'
dependencies = [
    'pandas',
]
dynamic = ['description', 'version', 'authors', 'maintainers']

[project.scripts]
autograde = 'github_classroom_toolkit.__main__:main'

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch]
description = { path = 'src/github_classroom_toolkit/__about__.py' }
version = { path = 'src/github_classroom_toolkit/__about__.py' }
authors = { path = 'src/github_classroom_toolkit/__about__.py' }
maintainers = { path = 'src/github_classroom_toolkit/__about__.py' }
